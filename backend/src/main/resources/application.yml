spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/societycart}
    username: ${DATABASE_USER:societycart}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  demo: ${DEMO_MODE:false}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  payment-provider: ${PAYMENT_PROVIDER:simulated}
